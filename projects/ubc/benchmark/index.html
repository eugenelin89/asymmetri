<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBC engine benchmark · local tooling</title>
<style>
body { margin: 24px; background:#162026; color:#e7eeee; font:15px/1.5 system-ui,sans-serif; }
h1 { font-size:24px; } label { display:inline-flex; flex-direction:column; gap:4px; margin:0 12px 12px 0; }
input,select,button,textarea { font:inherit; padding:8px; } button,a { margin-right:12px; } a { color:#b4e9dc; }
.viewport { max-width:100%; overflow:auto; } #scene { width:1280px; height:720px; background:#000; } #scene canvas { width:100%; height:100%; pointer-events:none; }
textarea { box-sizing:border-box; width:100%; min-height:160px; } #status { min-height:24px; } #preview { max-width:100%; }
:focus-visible { outline:3px solid #93ddcc; outline-offset:3px; } [hidden] { display:none; }
</style></head><body>
<h1>UBC engine benchmark</h1>
<p>Local tooling. Uses the campus renderer and pinned GIS; excludes the React shell, community profiles and audio. No visitor analytics or production writes.</p>
<form id="controls">
<label>Scene<select id="station"></select></label>
<label>Quality<select id="quality"><option>high</option><option>medium</option><option>low</option></select></label>
<label>Run mode<select id="mode"><option value="live">Live performance</option><option value="frozen">Frozen visual reference</option><option value="no-population">Population-off comparison</option></select></label>
<label>Canvas size<select id="size"><option value="1280x720">1280 × 720 desktop</option><option value="390x700">390 × 700 phone viewport (not a phone test)</option><option value="820x900">820 × 900 tablet viewport</option></select></label>
<label>Hardware / browser / power state<input id="device" size="48" required placeholder="Record actual device, OS, browser and power mode"></label>
<label>Repetitions<select id="repetitions"><option>1</option><option>3</option></select></label>
<button type="submit" id="run">Run scene · 5s warmup + 30s sample</button><button type="button" id="all">Run all scenes</button>
</form>
<button type="button" id="cancel" disabled>Cancel run</button>
<p id="status" role="status">Ready. Keep this tab visible and leave the viewport unchanged during a sample.</p>
<div class="viewport"><div id="scene" aria-label="Benchmark campus scene"></div></div>
<p><a id="save-photo" hidden>Save current scene PNG</a><a id="save-report" hidden download="ubc-benchmark.json">Save report JSON</a></p>
<img id="preview" hidden alt="Fixed-camera campus capture">
<label for="report">Measured report (includes raw frame intervals)</label><textarea id="report" readonly></textarea>
<script type="module" src="./runner.ts"></script></body></html>
